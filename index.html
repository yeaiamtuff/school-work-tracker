<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StudyOS</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f5f8;
  --card:#fff;
  --text:#171717;
  --muted:#777;
  --border:#e5e5e5;
  --accent:#6c5ce7;
}

body.dark{
  --bg:#111217;
  --card:#1b1d24;
  --text:#f5f5f5;
  --muted:#aaa;
  --border:#30323b;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:235px;
  background:var(--card);
  border-right:1px solid var(--border);
  padding:20px 14px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:24px;
  font-weight:800;
  margin:8px 10px 30px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:13px;
  text-align:left;
  border-radius:10px;
  margin-bottom:5px;
  cursor:pointer;
  font-size:15px;
}

.nav button:hover,
.nav button.active{
  background:var(--accent);
  color:white;
}

.bottom{
  margin-top:auto;
}

/* MAIN */

.main{
  margin-left:235px;
  width:calc(100% - 235px);
  padding:28px;
}

.page{
  display:none;
  max-width:1000px;
  margin:auto;
}

.page.active{
  display:block;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.topbar h1{
  margin:0;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}

/* PROFILE */

.profile{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-ring{
  width:70px;
  height:70px;
  padding:4px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff2222,#ff2222);
  box-shadow:0 0 12px #ff222288;
  animation:pulse 2s infinite;
}

.profile-ring img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

@keyframes pulse{
  50%{box-shadow:0 0 24px var(--ring)}
}

.level{
  font-size:14px;
  color:var(--muted);
  margin-top:4px;
}

.xpbar{
  height:9px;
  background:var(--border);
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.xpfill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3333,#6c5ce7);
  transition:.4s;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  padding:18px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-top:7px;
}

/* FORMS */

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--bg);
  color:var(--text);
}

button{
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:white;
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:bold;
}

.full{
  width:100%;
  margin-top:18px;
}

/* ASSIGNMENTS */

.class-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}

.class-header{
  padding:18px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
  font-size:18px;
  font-weight:bold;
}

.assignments{
  display:none;
  border-top:1px solid var(--border);
}

.assignment{
  padding:17px;
  border-bottom:1px solid var(--border);
}

.assignment:last-child{
  border-bottom:0;
}

.assignment-name{
  font-weight:bold;
  font-size:17px;
}

.info{
  color:var(--muted);
  line-height:1.6;
  margin-top:6px;
}

.due{
  font-weight:bold;
  margin-top:7px;
}

.normal{color:var(--muted)}
.warning{color:#e69a00}
.danger{color:#e00000}

.small-btn{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  margin-top:10px;
}

.complete{
  background:#dff7e5;
  color:#177333;
}

.delete{
  background:#ffdede;
  color:#a00000;
  margin-left:5px;
}

/* STOPWATCH */

.timer{
  text-align:center;
  font-size:65px;
  font-weight:bold;
  letter-spacing:2px;
  margin:35px 0;
}

.timer-buttons{
  display:flex;
  gap:10px;
  justify-content:center;
}

.timer-buttons button{
  border:0;
  border-radius:10px;
  padding:13px 22px;
  font-weight:bold;
}

.start{background:#6c5ce7;color:white}
.pause{background:#ddd}
.reset{background:#ffdddd;color:#a00000}

/* PROFILE PAGE */

.avatar-preview{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  display:block;
  margin-bottom:15px;
}

/* MOBILE */

@media(max-width:700px){
  .sidebar{
    width:70px;
    padding:15px 8px;
  }

  .logo{
    font-size:0;
    margin-bottom:25px;
  }

  .logo:after{
    content:"S";
    font-size:23px;
  }

  .nav button{
    text-align:center;
    font-size:0;
  }

  .nav button:first-letter{
    font-size:20px;
  }

  .main{
    margin-left:70px;
    width:calc(100% - 70px);
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">StudyOS</div>

<div class="nav">

<button class="active" onclick="showPage('dashboard',this)">🏠 Dashboard</button>

<button onclick="showPage('assignments',this)">📚 Assignments</button>

<button onclick="showPage('study',this)">⏱ Study</button>

<button onclick="showPage('profile',this)">👤 Profile</button>

</div>

<div class="bottom">

<button class="nav button" onclick="showPage('settings',this)">
⚙️ Settings
</button>

</div>

</aside>


<main class="main">

<!-- DASHBOARD -->

<section id="dashboard" class="page active">

<div class="topbar">
<h1>Dashboard</h1>
</div>

<div class="card">

<div class="profile">

<div class="profile-ring" id="dashboardRing">
<img id="dashboardAvatar" src="">
</div>

<div>

<div class="xpbar">

</div>

</div>

<div class="stats">

<div class="stat">
Assignments
<div class="stat-number" id="assignmentCount">0</div>
</div>

<div class="stat">
Study XP
<div class="stat-number" id="studyXP">0</div>
</div>

</div>

</section>


<!-- ASSIGNMENTS -->

<section id="assignments" class="page">

<div class="topbar">
<h1>Assignments</h1>
</div>

<div class="card">

<h2>Add Assignment</h2>

<label>What class?</label>
<input id="classInput" placeholder="Example: Math">

<label>What type?</label>
<select id="typeInput">
<option>Homework</option>
<option>Quiz</option>
<option>Test</option>
<option>Project</option>
<option>Essay</option>
<option>Worksheet</option>
<option>Other</option>
</select>

<label>Rough time estimate</label>
<input id="timeInput" placeholder="Example: 30 minutes">

<label>Name of assignment</label>
<input id="nameInput" placeholder="Example: Chapter 4 Review">

<label>Date due</label>
<input id="dateInput" type="date">

<button class="primary full" onclick="addAssignment()">
Add Assignment
</button>

</div>

<div id="assignmentList"></div>

</section>


<!-- STUDY -->

<section id="study" class="page">

<div class="topbar">
<h1>Study Timer</h1>
</div>

<div class="card">

<h2>Study Stopwatch</h2>

<p style="color:var(--muted)">
Every minute studied = <b>2 XP</b>
</p>

<div class="timer" id="timer">
00:00:00
</div>

<div class="timer-buttons">

<button class="start" onclick="startTimer()">Start</button>

<button class="pause" onclick="pauseTimer()">Pause</button>

<button class="reset" onclick="resetTimer()">Reset</button>

</div>

</div>

</section>


<!-- PROFILE -->

<section id="profile" class="page">

<div class="topbar">
<h1>Profile</h1>
</div>

<div class="card">

<h2>Your Profile</h2>

<div class="profile">

<div class="profile-ring">
<img id="profileAvatar" src="">
</div>

<div>
<h3 id="profileNameText">Student</h3>
<div>
Level <span id="profileLevel">1</span>
</div>
</div>

</div>

<label>Your name</label>
<input id="nameInputProfile" placeholder="Your name">

<label>Profile picture</label>
<input type="file" id="avatarInput" accept="image/*">

<button class="primary full" onclick="saveProfile()">
Save Profile
</button>

</div>

</section>


<!-- SETTINGS -->

<section id="settings" class="page">

<div class="topbar">
<h1>Settings</h1>
</div>

<div class="card">

<h2>Appearance</h2>

<label>
Dark Mode
</label>

<select id="darkMode" onchange="changeTheme()">
<option value="off">Off</option>
<option value="on">On</option>
</select>

</div>

</section>

</main>

</div>


<script>

/* =========================
   DATA
========================= */

let assignments =
JSON.parse(localStorage.getItem("assignments")) || [];

let user =
JSON.parse(localStorage.getItem("studyUser")) || {

name:"Student",

avatar:"",

xp:0

};


/* =========================
   LEVEL SYSTEM
========================= */

function xpForLevel(level){

return Math.floor(
100 * Math.pow(1.45, level - 1)
);

}

function getLevel(){

let level = 1;

let xp = user.xp;

while(xp >= xpForLevel(level)){

xp -= xpForLevel(level);

level++;

}

return level;

}

function getLevelProgress(){

let level = getLevel();

let totalBefore = 0;

for(let i=1;i<level;i++){

totalBefore += xpForLevel(i);

}

let currentXP = user.xp - totalBefore;

let needed = xpForLevel(level);

return {
level,
current:currentXP,
needed,
percent:(currentXP/needed)*100
};

}


/* =========================
   XP
========================= */

function addXP(amount){

user.xp += amount;

saveUser();

updateUI();

}

function saveUser(){

localStorage.setItem(
"studyUser",
JSON.stringify(user)
);

}
